name: Android app

on:
  push:
    branches: [main]
    paths: ['android-app/**', 'watch-link/**', 'watch-faces/live/**', '.github/workflows/android-app.yml']
  pull_request:
    paths: ['android-app/**', 'watch-link/**', 'watch-faces/live/**', '.github/workflows/android-app.yml']
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android-app
        env:
          # Optional built-in Gemini key for Ask (repo Settings > Secrets > Actions). Never in the code.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../WatchLink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WatchLink-apk
          path: WatchLink.apk

      # On main, publish each build as a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/WatchLink.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Health Watcher app v0.1.${{ github.run_number }}
          make_latest: true
          files: WatchLink.apk
          body: |
            Android app for Health Watcher, built from ${{ github.sha }}.
            Install: download WatchLink.apk on the phone, open it, and allow installing from this source.
