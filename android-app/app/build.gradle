plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
// Built-in Gemini key for Ask, from the GEMINI_API_KEY build secret (empty when not set). Only
// key-safe characters are accepted so the value can't break out of the generated Java string.
// Tidied first: pasted secrets often carry spaces/newlines, surrounding quotes or a NAME= prefix.
def geminiKey = (System.getenv("GEMINI_API_KEY") ?: "").trim()
geminiKey = geminiKey.replaceFirst(/^[A-Za-z_]+=/, "").trim()
if (geminiKey.length() >= 2 && (geminiKey[0] == '"' || geminiKey[0] == "'") && geminiKey[-1] == geminiKey[0]) geminiKey = geminiKey[1..-2].trim()
// Log only whether a key was built in and its length, never the key itself.
if (geminiKey.isEmpty()) println "Gemini built-in key: not set"
else if (!(geminiKey ==~ /[A-Za-z0-9._-]+/)) { println "Gemini built-in key: rejected (${geminiKey.length()} chars; contains characters other than letters, digits, . _ -)"; geminiKey = "" }
else println "Gemini built-in key: built in (${geminiKey.length()} chars)"

android {
    namespace 'net.pictakshay.watchlink'
    compileSdk 34

    defaultConfig {
        applicationId 'net.pictakshay.watchlink'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "0.1.${runNumber}"
        buildConfigField "String", "GEMINI_DEFAULT_KEY", "\"${geminiKey}\""
    }
    buildFeatures { buildConfig true }

    // One shared, throwaway signing key kept in the repo, so each new build installs as an
    // update over the previous one. It is only for sideloading, never for a store listing.
    signingConfigs {
        shared {
            storeFile file('../watchlink-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The Watch Link page and the live faces are copied in from the repo at build time,
    // so the app always ships the same page as the website.
    sourceSets {
        main { assets.srcDirs += ["$buildDir/generated/webassets"] }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from('../../watch-link') { into 'watch-link' }
    from('../../watch-faces/live') { include '*.bin'; into 'watch-faces/live' }
    into "$buildDir/generated/webassets"
}
preBuild.dependsOn copyWebAssets
